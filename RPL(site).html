<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPL — Counter-Strike Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f1419; color: #e6e6e6; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%); border-bottom: 2px solid #2a3f5f; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #4a9eff; }
  .logo-text { font-size: 28px; font-weight: 800; letter-spacing: 3px; color: #4a9eff; text-shadow: 0 0 20px rgba(74,158,255,0.5); }

  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  h1 { font-size: 32px; margin-bottom: 10px; color: #fff; }
  .subtitle { color: #7a8ba0; margin-bottom: 40px; font-size: 14px; letter-spacing: 1px; }

  .winner-block { background: linear-gradient(145deg, #1a2332, #141b26); border: 1px solid #2a3f5f; border-radius: 16px; padding: 30px; margin-bottom: 40px; text-align: center; }
  .winner-photo { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 4px solid #4a9eff; box-shadow: 0 0 40px rgba(74,158,255,0.4); margin-bottom: 20px; }
  .winner-label { color: #7a8ba0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
  .winner-name { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 15px; }
  .tournament-link { display: inline-block; background: #4a9eff; color: #0f1419; padding: 10px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .tournament-link:hover { background: #6fb3ff; }

  .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .player-card { background: linear-gradient(145deg, #1a2332, #141b26); border: 1px solid #2a3f5f; border-radius: 12px; padding: 20px; transition: all 0.3s ease; cursor: pointer; text-align: center; }
  .player-card:hover { transform: translateY(-5px); border-color: #4a9eff; box-shadow: 0 10px 30px rgba(74,158,255,0.2); }
  .player-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #2a3f5f; margin-bottom: 15px; }
  .player-nick { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 5px; }
  .player-role { display: inline-block; background: #4a9eff; color: #0f1419; font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
  .player-real-name { color: #7a8ba0; font-size: 13px; margin-top: 8px; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; padding: 40px 20px; }
  .modal-overlay.active { display: block; }
  .modal { background: #1a2332; border: 1px solid #2a3f5f; border-radius: 16px; max-width: 700px; margin: 0 auto; padding: 40px; position: relative; }
  .modal-close { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #7a8ba0; cursor: pointer; background: none; border: none; }
  .modal-close:hover { color: #fff; }
  .modal-photo { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid #4a9eff; margin-bottom: 20px; }
  .modal h2 { color: #fff; font-size: 32px; margin-bottom: 5px; }
  .modal .role { color: #4a9eff; font-weight: 700; margin-bottom: 20px; }
  .modal .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2a3f5f; }
  .modal .info-row span:first-child { color: #7a8ba0; }
  .modal .info-row span:last-child { color: #fff; font-weight: 600; }
  .modal h3 { color: #4a9eff; margin: 25px 0 15px; font-size: 18px; }
  .tournament-item { background: #0f1419; border: 1px solid #2a3f5f; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
  .tournament-item .t-name { color: #fff; font-weight: 700; margin-bottom: 5px; }
  .tournament-item .t-info { color: #7a8ba0; font-size: 13px; }

  .admin-section { background: #1a2332; border: 1px solid #2a3f5f; border-radius: 12px; padding: 30px; margin-bottom: 40px; }
  .admin-section h2 { color: #4a9eff; margin-bottom: 20px; font-size: 20px; }
  .admin-section h3 { color: #e6e6e6; margin: 20px 0 10px; font-size: 15px; }
  .form-group { margin-bottom: 12px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; max-width: 400px; padding: 10px 14px; background: #0f1419; border: 1px solid #2a3f5f; border-radius: 8px; color: #e6e6e6; font-size: 14px; font-family: inherit; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #4a9eff; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-right: 8px; }
  .btn-primary { background: #4a9eff; color: #0f1419; }
  .btn-primary:hover { background: #6fb3ff; }
  .btn-secondary { background: transparent; color: #7a8ba0; border: 1px solid #2a3f5f; }
  .btn-secondary:hover { color: #fff; border-color: #4a9eff; }
  .btn-danger { background: transparent; color: #ff4a4a; border: 1px solid #ff4a4a; }
  .btn-danger:hover { background: #ff4a4a; color: #fff; }
  .status-msg { margin-top: 12px; font-size: 13px; color: #7a8ba0; }
  .status-msg.error { color: #ff4a4a; }
  .status-msg.success { color: #4aff88; }
  .loader { text-align: center; color: #7a8ba0; padding: 40px; font-size: 14px; }
  footer { text-align: center; padding: 30px; color: #4a5a70; font-size: 12px; border-top: 1px solid #1a2332; margin-top: 60px; }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <img id="logoImg" class="logo-img" src="" alt="RPL">
    <div class="logo-text">RPL</div>
  </div>
</header>

<div class="container">
  <h1>RPL</h1>
  <p class="subtitle">COUNTER-STRIKE ROSTER</p>

  <div id="winnerBlock"></div>

  <div id="adminPanel" class="admin-section" style="display:none;">
    <h2>➕ Добавить игрока</h2>
    <div class="form-group"><input type="text" id="nick" placeholder="Ник"></div>
    <div class="form-group"><input type="text" id="realName" placeholder="Настоящее имя"></div>
    <div class="form-group"><input type="text" id="role" placeholder="Роль (AWP / Rifler / IGL)"></div>
    <div class="form-group"><input type="text" id="photoUrl" placeholder="URL фото (ссылка на картинку)"></div>
    <div class="form-group"><input type="text" id="country" placeholder="Страна"></div>
    <div class="form-group"><input type="text" id="bio" placeholder="Краткое описание"></div>
    <button class="btn btn-primary" onclick="addPlayer()">Сохранить игрока</button>

    <h3>🏆 Добавить турнир</h3>
    <div class="form-group"><input type="text" id="tName" placeholder="Название турнира"></div>
    <div class="form-group"><input type="date" id="tDate"></div>
    <div class="form-group"><input type="number" id="tPrize" placeholder="Призовой фонд ($)"></div>
    <div class="form-group"><input type="text" id="tDesc" placeholder="Описание"></div>
    <div class="form-group">
      <select id="tWinner"><option value="">Победитель (выбрать)</option></select>
    </div>
    <div class="form-group">
      <select id="tMvp"><option value="">MVP (выбрать)</option></select>
    </div>
    <label style="color:#7a8ba0; font-size:13px;"><input type="checkbox" id="tLatest"> Это последний турнир (показать на главной)</label>
    <br><br>
    <button class="btn btn-primary" onclick="addTournament()">Сохранить турнир</button>

    <button class="btn btn-danger" onclick="logout()" style="margin-top:20px;">Выйти</button>
    <div id="adminStatus" class="status-msg"></div>
  </div>

  <div id="loginPanel" class="admin-section" style="display:none;">
    <h2>🔐 Вход для администратора</h2>
    <div class="form-group"><input type="email" id="email" placeholder="Email"></div>
    <div class="form-group"><input type="password" id="password" placeholder="Пароль"></div>
    <button class="btn btn-primary" onclick="login()">Войти</button>
    <button class="btn btn-secondary" onclick="hideLogin()">Отмена</button>
    <div id="loginStatus" class="status-msg"></div>
  </div>

  <div id="guestBar" style="margin-bottom:30px; text-align:right;">
    <button class="btn btn-secondary" onclick="showLogin()">Войти как админ</button>
  </div>

  <div id="playersList">
    <div class="loader">Загрузка игроков...</div>
  </div>
</div>

<div id="playerModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="playerModalContent"></div>
</div>

<div id="tournamentModal" class="modal-overlay" onclick="if(event.target===this)closeTournamentModal()">
  <div class="modal" id="tournamentModalContent"></div>
</div>

<footer>© RPL Team — Counter-Strike Roster</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fupiurmwkfpicfvigchd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_N-p4CNsypVEzaPKxnzH8mw_UPu43izZ';
  const LOGO_URL = 'https://i.postimg.cc/KYXSy3mn/file.webp';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  if (LOGO_URL && !LOGO_URL.startsWith('ЗАМЕНИ')) {
    document.getElementById('logoImg').src = LOGO_URL;
  } else {
    document.getElementById('logoImg').style.display = 'none';
  }

  async function loadWinner() {
    const block = document.getElementById('winnerBlock');
    const { data, error } = await db.from('tournaments').select('*').eq('is_latest', true).limit(1).maybeSingle();
    if (error || !data) { block.innerHTML = ''; return; }

    const { data: winner } = await db.from('players').select('*').eq('id', data.winner_player_id).maybeSingle();
    if (!winner) { block.innerHTML = ''; return; }

    block.innerHTML = `
      <div class="winner-block">
        <div class="winner-label">Победитель последнего турнира</div>
        <img class="winner-photo" src="${winner.photo_url || ''}" alt="${escapeHtml(winner.nickname)}">
        <div class="winner-name">${escapeHtml(winner.nickname)}</div>
        <div class="tournament-link" onclick="openTournament(${data.id})">${escapeHtml(data.name)}</div>
      </div>
    `;
  }

  async function loadPlayers() {
    const list = document.getElementById('playersList');
    const { data, error } = await db.from('players').select('*');
    if (error) { list.innerHTML = '<div class="loader" style="color:#ff4a4a;">Ошибка: ' + error.message + '</div>'; return; }
    if (!data || data.length === 0) { list.innerHTML = '<div class="loader">Пока нет игроков</div>'; return; }

    list.innerHTML = '<div class="players-grid">' + data.map(p => `
      <div class="player-card" onclick="openPlayer(${p.id})">
        <img src="${p.photo_url || ''}" alt="${escapeHtml(p.nickname)}">
        <div class="player-nick">${escapeHtml(p.nickname)}</div>
        ${p.role ? `<div class="player-role">${escapeHtml(p.role)}</div>` : ''}
        ${p.real_name ? `<div class="player-real-name">${escapeHtml(p.real_name)}</div>` : ''}
      </div>
    `).join('') + '</div>';
  }

  async function openPlayer(id) {
    const { data: p } = await db.from('players').select('*').eq('id', id).maybeSingle();
    if (!p) return;

    const { data: stats } = await db.from('player_stats').select('*, tournaments(name, date)').eq('player_id', id);

    let tournamentsHtml = '';
    if (stats && stats.length > 0) {
      tournamentsHtml = stats.map(s => `
        <div class="tournament-item">
          <div class="t-name">${escapeHtml(s.tournaments?.name || 'Турнир')}</div>
          <div class="t-info">K/D: ${s.kills}/${s.deaths} · MVP: ${s.mvp_count} · Приз: $${s.prize_won}</div>
        </div>
      `).join('');
    } else {
      tournamentsHtml = '<div class="t-info" style="color:#7a8ba0;">Нет данных о турнирах</div>';
    }

    document.getElementById('playerModalContent').innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <img class="modal-photo" src="${p.photo_url || ''}" alt="${escapeHtml(p.nickname)}">
      <h2>${escapeHtml(p.nickname)}</h2>
      <div class="role">${escapeHtml(p.role || '')}</div>
      <div class="info-row"><span>Настоящее имя</span><span>${escapeHtml(p.real_name || '—')}</span></div>
      <div class="info-row"><span>Страна</span><span>${escapeHtml(p.country || '—')}</span></div>
      <div class="info-row"><span>Всего заработано</span><span>$${p.total_earnings || 0}</span></div>
      <h3>🏆 Турниры</h3>
      ${tournamentsHtml}
    `;
    document.getElementById('playerModal').classList.add('active');
  }

  function closeModal() { document.getElementById('playerModal').classList.remove('active'); }

  async function openTournament(id) {
    const { data: t } = await db.from('tournaments').select('*').eq('id', id).maybeSingle();
    if (!t) return;

    const { data: winner } = t.winner_player_id ? await db.from('players').select('nickname').eq('id', t.winner_player_id).maybeSingle() : { data: null };
    const { data: mvp } = t.mvp_player_id ? await db.from('players').select('nickname').eq('id', t.mvp_player_id).maybeSingle() : { data: null };

    const { data: participants } = await db.from('tournament_participants').select('*, players(nickname)').eq('tournament_id', id);

    let partsHtml = '';
    if (participants && participants.length > 0) {
      partsHtml = participants.map(p => `<div class="t-info">${escapeHtml(p.players?.nickname || '—')} — место ${p.placement || '?'}</div>`).join('');
    } else {
      partsHtml = '<div class="t-info" style="color:#7a8ba0;">Нет данных об участниках</div>';
    }

    document.getElementById('tournamentModalContent').innerHTML = `
      <button class="modal-close" onclick="closeTournamentModal()">×</button>
      <h2>${escapeHtml(t.name)}</h2>
      <div class="info-row"><span>Дата</span><span>${t.date || '—'}</span></div>
      <div class="info-row"><span>Призовой фонд</span><span>$${t.prize_pool || 0}</span></div>
      <div class="info-row"><span>Победитель</span><span>${escapeHtml(winner?.nickname || '—')}</span></div>
      <div class="info-row"><span>MVP</span><span>${escapeHtml(mvp?.nickname || '—')}</span></div>
      <h3>Участники</h3>
      ${partsHtml}
      ${t.description ? `<h3>Описание</h3><div class="t-info">${escapeHtml(t.description)}</div>` : ''}
    `;
    document.getElementById('tournamentModal').classList.add('active');
  }

  function closeTournamentModal() { document.getElementById('tournamentModal').classList.remove('active'); }

  async function addPlayer() {
    const status = document.getElementById('adminStatus');
    const nickname = document.getElementById('nick').value.trim();
    if (!nickname) { status.textContent = 'Ник обязателен'; status.className = 'status-msg error'; return; }

    const payload = {
      nickname,
      real_name: document.getElementById('realName').value.trim(),
      role: document.getElementById('role').value.trim(),
      photo_url: document.getElementById('photoUrl').value.trim(),
      country: document.getElementById('country').value.trim(),
      bio: document.getElementById('bio').value.trim()
    };

    const { error } = await db.from('players').insert([payload]);
    if (error) { status.textContent = 'Ошибка: ' + error.message; status.className = 'status-msg error'; }
    else {
      status.textContent = '✅ Игрок добавлен!'; status.className = 'status-msg success';
      document.getElementById('nick').value = ''; document.getElementById('realName').value = '';
      document.getElementById('role').value = ''; document.getElementById('photoUrl').value = '';
      document.getElementById('country').value = ''; document.getElementById('bio').value = '';
      loadPlayers(); loadWinner(); refreshSelects();
    }
  }

  async function addTournament() {
    const status = document.getElementById('adminStatus');
    const name = document.getElementById('tName').value.trim();
    if (!name) { status.textContent = 'Название турнира обязательно'; status.className = 'status-msg error'; return; }

    if (document.getElementById('tLatest').checked) {
      await db.from('tournaments').update({ is_latest: false }).eq('is_latest', true);
    }

    const payload = {
      name,
      date: document.getElementById('tDate').value || null,
      prize_pool: parseInt(document.getElementById('tPrize').value) || 0,
      description: document.getElementById('tDesc').value.trim(),
      winner_player_id: document.getElementById('tWinner').value || null,
      mvp_player_id: document.getElementById('tMvp').value || null,
      is_latest: document.getElementById('tLatest').checked
    };

    const { error } = await db.from('tournaments').insert([payload]);
    if (error) { status.textContent = 'Ошибка: ' + error.message; status.className = 'status-msg error'; }
    else {
      status.textContent = '✅ Турнир добавлен!'; status.className = 'status-msg success';
      document.getElementById('tName').value = ''; document.getElementById('tDate').value = '';
      document.getElementById('tPrize').value = ''; document.getElementById('tDesc').value = '';
      document.getElementById('tWinner').value = ''; document.getElementById('tMvp').value = '';
      document.getElementById('tLatest').checked = false;
      loadWinner();
    }
  }

  async function refreshSelects() {
    const { data } = await db.from('players').select('id, nickname');
    const w = document.getElementById('tWinner');
    const m = document.getElementById('tMvp');
    w.innerHTML = '<option value="">Победитель (выбрать)</option>' + (data || []).map(p => `<option value="${p.id}">${escapeHtml(p.nickname)}</option>`).join('');
    m.innerHTML = '<option value="">MVP (выбрать)</option>' + (data || []).map(p => `<option value="${p.id}">${escapeHtml(p.nickname)}</option>`).join('');
  }

  async function login() {
    const status = document.getElementById('loginStatus');
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value
    });
    if (error) { status.textContent = 'Ошибка: ' + error.message; status.className = 'status-msg error'; }
    else { checkUser(); refreshSelects(); }
  }

  async function logout() { await db.auth.signOut(); checkUser(); }

  function showLogin() { document.getElementById('loginPanel').style.display = 'block'; document.getElementById('guestBar').style.display = 'none'; }
  function hideLogin() { document.getElementById('loginPanel').style.display = 'none'; document.getElementById('guestBar').style.display = 'block'; }

  async function checkUser() {
    const { data: { user } } = await db.auth.getUser();
    const admin = document.getElementById('adminPanel');
    const login = document.getElementById('loginPanel');
    const guest = document.getElementById('guestBar');
    if (user) { admin.style.display = 'block'; login.style.display = 'none'; guest.style.display = 'none'; }
    else { admin.style.display = 'none'; login.style.display = 'none'; guest.style.display = 'block'; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  loadPlayers();
  loadWinner();
  checkUser();
</script>
</body>
</html>
