<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPL — Counter-Strike Team</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f1419;
    color: #e6e6e6;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
    border-bottom: 2px solid #2a3f5f;
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #4a9eff;
    text-shadow: 0 0 20px rgba(74,158,255,0.5);
  }

  .logo span { color: #e6e6e6; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 10px;
    color: #fff;
  }

  .subtitle {
    color: #7a8ba0;
    margin-bottom: 40px;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .player-card {
    background: linear-gradient(145deg, #1a2332, #141b26);
    border: 1px solid #2a3f5f;
    border-radius: 12px;
    padding: 25px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .player-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: #4a9eff;
    transition: width 0.3s ease;
  }

  .player-card:hover {
    transform: translateY(-5px);
    border-color: #4a9eff;
    box-shadow: 0 10px 30px rgba(74,158,255,0.2);
  }

  .player-card:hover::before { width: 100%; opacity: 0.05; }

  .player-nick {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 5px;
    position: relative;
    z-index: 1;
  }

  .player-role {
    display: inline-block;
    background: #4a9eff;
    color: #0f1419;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
  }

  .player-real-name {
    color: #7a8ba0;
    font-size: 14px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

  .player-bio {
    color: #a8b5c4;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    z-index: 1;
  }

  /* Панель администратора */
  .admin-section {
    background: #1a2332;
    border: 1px solid #2a3f5f;
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 40px;
  }

  .admin-section h2 {
    color: #4a9eff;
    margin-bottom: 20px;
    font-size: 20px;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group input {
    width: 100%;
    max-width: 400px;
    padding: 12px 15px;
    background: #0f1419;
    border: 1px solid #2a3f5f;
    border-radius: 8px;
    color: #e6e6e6;
    font-size: 14px;
    transition: border-color 0.2s;
  }

  .form-group input:focus {
    outline: none;
    border-color: #4a9eff;
  }

  .btn {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-primary {
    background: #4a9eff;
    color: #0f1419;
  }

  .btn-primary:hover { background: #6fb3ff; }

  .btn-danger {
    background: transparent;
    color: #ff4a4a;
    border: 1px solid #ff4a4a;
  }

  .btn-danger:hover { background: #ff4a4a; color: #fff; }

  .status-msg {
    margin-top: 15px;
    font-size: 13px;
    color: #7a8ba0;
  }

  .status-msg.error { color: #ff4a4a; }
  .status-msg.success { color: #4aff88; }

  .loader {
    text-align: center;
    color: #7a8ba0;
    padding: 40px;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 30px;
    color: #4a5a70;
    font-size: 12px;
    border-top: 1px solid #1a2332;
    margin-top: 60px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">RPL<span>.</span></div>
</header>

<div class="container">
  <h1>Наша команда</h1>
  <p class="subtitle">COUNTER-STRIKE ROSTER</p>

  <!-- Форма входа (видна только когда ты не залогинен) -->
  <div id="loginPanel" class="admin-section">
    <h2>🔐 Вход для администратора</h2>
    <div class="form-group">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="form-group">
      <input type="password" id="password" placeholder="Пароль">
    </div>
    <button class="btn btn-primary" onclick="login()">Войти</button>
    <div id="loginStatus" class="status-msg"></div>
  </div>

  <!-- Панель администратора (видна только когда ты залогинен) -->
  <div id="adminPanel" class="admin-section" style="display:none;">
    <h2>➕ Добавить игрока</h2>
    <div class="form-group"><input type="text" id="nick" placeholder="Ник"></div>
    <div class="form-group"><input type="text" id="realName" placeholder="Настоящее имя"></div>
    <div class="form-group"><input type="text" id="role" placeholder="Роль (AWP / Rifler / IGL / Support)"></div>
    <div class="form-group"><input type="text" id="bio" placeholder="Краткое описание"></div>
    <button class="btn btn-primary" onclick="addPlayer()">Сохранить игрока</button>
    <button class="btn btn-danger" onclick="logout()" style="margin-left:10px;">Выйти</button>
    <div id="adminStatus" class="status-msg"></div>
  </div>

  <!-- Список игроков -->
  <div id="playersList">
    <div class="loader">Загрузка игроков...</div>
  </div>
</div>

<footer>
  © RPL Team — Counter-Strike Roster
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  //
  const SUPABASE_URL = 'https://fupiurmwkfpicfvigchd.supabase.co/rest/v1/';
  const SUPABASE_KEY = 'sb_publishable_N-p4CNsypVEzaPKxnzH8mw_UPu43izZ';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- Загрузка игроков ----
  async function loadPlayers() {
    const list = document.getElementById('playersList');
    const { data, error } = await db.from('players').select('*').order('id', { ascending: true });

    if (error) {
      list.innerHTML = '<div class="loader" style="color:#ff4a4a;">Ошибка загрузки: ' + error.message + '</div>';
      return;
    }

    if (!data || data.length === 0) {
      list.innerHTML = '<div class="loader">Пока нет игроков</div>';
      return;
    }

    list.innerHTML = '<div class="players-grid">' + data.map(p => `
      <div class="player-card">
        <div class="player-nick">${escapeHtml(p.nickname)}</div>
        ${p.role ? `<div class="player-role">${escapeHtml(p.role)}</div>` : ''}
        ${p.real_name ? `<div class="player-real-name">${escapeHtml(p.real_name)}</div>` : ''}
        ${p.bio ? `<div class="player-bio">${escapeHtml(p.bio)}</div>` : ''}
      </div>
    `).join('') + '</div>';
  }

  // ---- Добавление игрока ----
  async function addPlayer() {
    const status = document.getElementById('adminStatus');
    const nickname = document.getElementById('nick').value.trim();
    const real_name = document.getElementById('realName').value.trim();
    const role = document.getElementById('role').value.trim();
    const bio = document.getElementById('bio').value.trim();

    if (!nickname) {
      status.textContent = 'Ник обязателен';
      status.className = 'status-msg error';
      return;
    }

    const { error } = await db.from('players').insert([{ nickname, real_name, role, bio }]);

    if (error) {
      status.textContent = 'Ошибка: ' + error.message;
      status.className = 'status-msg error';
    } else {
      status.textContent = '✅ Игрок добавлен!';
      status.className = 'status-msg success';
      document.getElementById('nick').value = '';
      document.getElementById('realName').value = '';
      document.getElementById('role').value = '';
      document.getElementById('bio').value = '';
      loadPlayers();
    }
  }

  // ---- Вход ----
  async function login() {
    const status = document.getElementById('loginStatus');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      status.textContent = 'Ошибка входа: ' + error.message;
      status.className = 'status-msg error';
    } else {
      status.textContent = '';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      checkUser();
    }
  }

  // ---- Выход ----
  async function logout() {
    await db.auth.signOut();
    checkUser();
  }

  // ---- Проверка статуса входа ----
  async function checkUser() {
    const { data: { user } } = await db.auth.getUser();
    const adminPanel = document.getElementById('adminPanel');
    const loginPanel = document.getElementById('loginPanel');

    if (user) {
      adminPanel.style.display = 'block';
      loginPanel.style.display = 'none';
    } else {
      adminPanel.style.display = 'none';
      loginPanel.style.display = 'block';
    }
  }

  // ---- Защита от XSS ----
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ---- Старт ----
  loadPlayers();
  checkUser();
</script>
</body>
</html>
